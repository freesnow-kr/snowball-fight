# Render 무료 플랜은 15분간 요청이 없으면 잠듦 → 10분마다 깨워 둠
# ponytail: GitHub 크론은 부하가 많을 때 몇 분~십수 분 늦을 수 있음. 완전히 안 잠들어야 하면 Render 유료 플랜
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -fsS -m 120 --retry 2 -o /dev/null -w "%{http_code} %{time_total}s\n" https://snowball.freesnow.org/rooms
