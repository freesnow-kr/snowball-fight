<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif;

  #hud { position: fixed; left: calc(12px + env(safe-area-inset-left)); top: calc(10px + env(safe-area-inset-top)); color: #123; font-weight: 700; font-size: 18px; text-shadow: 0 1px 0 #fff; pointer-events: none; white-space: pre-line; line-height: 1.35; }
  #board { position: fixed; right: calc(12px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top)); background: #ffffffaa; border-radius: 8px; padding: 6px 12px; font-size: 14px; pointer-events: none; min-width: 120px; }
  #teams { position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top)); transform: translateX(-50%); display: flex; gap: 8px; align-items: center;
    background: #ffffffcc; border-radius: 20px; padding: 4px 14px; font-weight: 800; font-size: 18px; pointer-events: none; white-space: nowrap; }

  #banner { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 34px; font-weight: 900; color: #fff;

  #start form { display: grid; gap: 12px; background: #ffffff1a; padding: 24px; border-radius: 14px; min-width: 260px; }
  #start input, #start button { font-size: 16px; padding: 8px; border-radius: 8px; border: 0; }
  #start button { background: #ff7a45; color: #fff; font-weight: 700; cursor: pointer; }
  #maps, #maps2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  #maps button, #maps2 button { background: #ffffff22; border: 2px solid transparent; min-height: 52px; font-size: 15px; }

  #maps button small, #maps2 button small { display: block; font-weight: 400; font-size: 12px; opacity: 0.85; }
  /* 입장 전에는 게임 화면 UI(버튼·점수판 등)를 숨김 */
  body:not(.playing) :is(#touch, #teams, #board, #hud, #help, #msg, #mapBtn) { display: none; }
  /* 모바일 터치 조작 */
  #touch { display: none; }
  .touch #touch { display: block; }
  .touch #help { display: none; }
  #joy { position: fixed; left: calc(24px + env(safe-area-inset-left)); bottom: calc(24px + env(safe-area-inset-bottom));

  #btns { position: fixed; right: calc(16px + env(safe-area-inset-right)); bottom: calc(20px + env(safe-area-inset-bottom));
    display: grid; grid-template-columns: repeat(2, 64px); gap: 10px; justify-items: center; }
  #btns button, #emoBar button { width: 64px; height: 64px; border-radius: 50%; border: 0; background: #ffffffbb;
    font-size: 24px; line-height: 1.1; box-shadow: 0 2px 6px #0003; padding: 0; color: #123; }
  #btns button small { display: block; font-size: 10px; font-weight: 700; }
  #btns button.on { background: #ffd166; }
  #btns .big { grid-column: span 2; width: 84px; height: 84px; font-size: 30px; background: #ff7a45ee; color: #fff; }
  #btns .big small { font-size: 9px; }
  /* 이모트는 버튼 묶음 바로 왼쪽에 2열로 (순위표·조이스틱과 안 겹치게) */
  #emoBar { position: fixed; right: calc(16px + 138px + 12px + env(safe-area-inset-right)); bottom: calc(20px + env(safe-area-inset-bottom));

  #emoBar.open { display: grid; }
  @media (orientation: portrait) { /* 세로 화면은 폭이 좁아 버튼 묶음 위쪽에 3열로 */
    #emoBar { right: calc(16px + env(safe-area-inset-right)); bottom: calc(266px + env(safe-area-inset-bottom)); grid-template-columns: repeat(3, 48px); } }
  /* 좌우 바꾸기: 조이스틱 오른쪽, 버튼 왼쪽 */
  #swap, #mapBtn { position: fixed; left: calc(12px + env(safe-area-inset-left)); top: calc(66px + env(safe-area-inset-top));
    border: 0; border-radius: 16px; padding: 6px 10px; background: #ffffffbb; font-size: 13px; font-weight: 700; color: #123; }
  #swap { top: calc(106px + env(safe-area-inset-top)); }
  /* 게임 중 맵 바꾸기 창 */

  #mapMenu.open { display: grid; }
  #mapMenu .panel { display: grid; gap: 12px; background: #ffffff1a; padding: 22px; border-radius: 14px; min-width: 260px; }

  @media (orientation: portrait) and (max-width: 700px) { /* 세로 폰: 팀 점수판을 맨 위, 나머지는 그 아래로 */
    #hud, #board { top: calc(48px + env(safe-area-inset-top)); } #mapBtn { top: calc(100px + env(safe-area-inset-top)); } #swap { top: calc(138px + env(safe-area-inset-top)); } }

<script type="module">
import * as THREE from 'three';
import { buildPenguin } from './chars.js';
import { blocksBall, MAPS, mapById, pushOut } from './maps.js';

const TEAM_COLORS = ['#ff7a2f', '#2f7bff'], TEAM_NAMES = ['🟠 오렌지팀', '🔵 블루팀'], TEAM_DOTS = ['🟠', '🔵'];
const ARENA = 50, MAX_AMMO = 10, G = -15, EMOTES = ['👋', '😂', '😡', '❤️', '😎', '🙏'];
const $ = (id) => document.getElementById(id);
const isTouch = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
if (isTouch) document.body.classList.add('touch');

// ---------- 장면 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#9fd3f5');
scene.fog = new THREE.Fog('#d6ecf8', 45, 115);
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 300);
function fit() {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 1 ? 90 : 65; // 세로 화면은 시야를 넓혀 캐릭터가 화면을 가리지 않게
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
fit();
addEventListener('resize', fit);
scene.add(new THREE.HemisphereLight('#ffffff', '#8aa7c7', 1.3));
const sun = new THREE.DirectionalLight('#fff4e0', 1.6);
sun.position.set(30, 50, 20); sun.castShadow = true; sun.shadow.mapSize.setScalar(isTouch ? 1024 : 2048); // 폰은 그림자 해상도를 낮춰 가볍게
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, far: 150 });
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);

const lam = (color) => new THREE.MeshLambertMaterial({ color });
const M = { snow: lam('#f7fbff'), white: lam('#ffffff'), dark: lam('#22263a'), trunk: lam('#6b4a2f'),
  leaf: lam('#2f6b4f'), carrot: lam('#ff8a3d'), pole: lam('#5b6577'), chair: lam('#3b7dd8'), hut: lam('#a0522d'), roof: lam('#c23b3b') };
function add(parent, geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; parent.add(m); return m;
}

// ---------- 맵: 지형(maps.js 의 h, 서버와 같음) + 화면 전용 소품. 방에 들어갈 때 그 맵으로 새로 짓는다 ----------
let map = MAPS[0], H = map.h, world = null, chairs = [];
const LIFT_X = -20, LIFT_Z0 = 38, LIFT_Z1 = -46, LIFT_TOP = 9;
const liftY = (z) => H(LIFT_X, z) + LIFT_TOP;
const SKY = { slope: ['#9fd3f5', '#d6ecf8'], forest: ['#a9cfe0', '#d3e6e0'], lake: ['#b5e2fb', '#e6f4fb'] };
const ROCK = lam('#8d96a3'), ICE = new THREE.MeshPhongMaterial({ color: '#bfe3f2', shininess: 90, specular: '#ffffff' });
// 장애물 그리기: 자리·크기는 maps.js(서버와 같은 목록), 모양은 여기서
function drawObstacle(o) {
  const g = new THREE.Group();
  if (o.kind === 'tree') {
    add(g, new THREE.CylinderGeometry(0.2, 0.28, 1.2), M.trunk, 0, 0.6, 0);
    add(g, new THREE.ConeGeometry(1.5, 2.4, 8), M.leaf, 0, 2, 0);
    add(g, new THREE.ConeGeometry(1.05, 1.9, 8), M.leaf, 0, 3.2, 0);
    add(g, new THREE.ConeGeometry(0.5, 0.8, 8), M.white, 0, 4.1, 0);
    g.position.y = -0.1;
  }
  if (o.kind === 'rock') {
    add(g, new THREE.DodecahedronGeometry(1), ROCK, 0, 0.4, 0);
    add(g, new THREE.SphereGeometry(0.75, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), M.white, 0, 0.85, 0);
  }
  if (o.kind === 'log') add(g, new THREE.CylinderGeometry(0.35, 0.35, 2.2, 10), M.trunk, 0, 0.35, 0).rotation.set(0, 0, Math.PI / 2);
  if (o.kind === 'hut') {
    add(g, new THREE.BoxGeometry(4, 2.6, 3), M.hut, 0, 1.3, 0);
    add(g, new THREE.ConeGeometry(3.2, 1.6, 4), M.roof, 0, 3.4, 0).rotation.y = Math.PI / 4;
  }
  g.position.x = o.x; g.position.z = o.z; g.position.y += o.y;
  g.scale.setScalar(o.s); g.rotation.y = o.rot ?? 0;
  world.add(g);
}
// ponytail: 맵을 바꿀 때 옛 지오메트리를 dispose 하지 않음. 맵을 자주 오가 메모리가 문제되면 그때 정리
function buildMap(id) {
  if (world) scene.remove(world);
  map = mapById(id); H = map.h; world = new THREE.Group(); chairs = [];
  scene.background.set(SKY[map.id][0]); scene.fog.color.set(SKY[map.id][1]);
  const geo = new THREE.PlaneGeometry(120, 120, 90, 90).rotateX(-Math.PI / 2), gp = geo.attributes.position;
  for (let i = 0; i < gp.count; i++) gp.setY(i, H(gp.getX(i), gp.getZ(i)));
  geo.computeVertexNormals();
  const ground = new THREE.Mesh(geo, M.snow); ground.receiveShadow = true; world.add(ground);
  for (const o of map.obstacles) drawObstacle(o);

  // 아래는 부딪히지 않는 장식
  if (map.id === 'slope') { // 리프트: 기둥·케이블·움직이는 의자
    const cablePts = [];
    for (let z = LIFT_Z0; z >= LIFT_Z1; z -= 12) {
      add(world, new THREE.CylinderGeometry(0.18, 0.25, LIFT_TOP), M.pole, LIFT_X, H(LIFT_X, z) + LIFT_TOP / 2, z);
      add(world, new THREE.BoxGeometry(3, 0.2, 0.2), M.pole, LIFT_X, liftY(z), z);
      cablePts.push(new THREE.Vector3(LIFT_X - 1.3, liftY(z), z));
    }
    const cable = new THREE.Line(new THREE.BufferGeometry().setFromPoints(cablePts), new THREE.LineBasicMaterial({ color: '#333' }));
    world.add(cable, cable.clone().translateX(2.6));
    chairs = Array.from({ length: 10 }, () => {
      const c = new THREE.Group();
      add(c, new THREE.CylinderGeometry(0.04, 0.04, 1.4), M.pole, 0, -0.7, 0);
      add(c, new THREE.BoxGeometry(1.2, 0.12, 0.6), M.chair, 0, -1.4, 0);
      add(c, new THREE.BoxGeometry(1.2, 0.6, 0.1), M.chair, 0, -1.1, 0.3);
      world.add(c); return c;
    });
  }
  if (map.id === 'lake') { // 빙판 + 낚시 구멍 + 나무 데크
    add(world, new THREE.CircleGeometry(map.ice, 64).rotateX(-Math.PI / 2), ICE, 0, 0.03, 0).receiveShadow = true;
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 6; i++) {
      const a = rnd() * Math.PI * 2, r = 4 + rnd() * 16, x = Math.cos(a) * r, z = Math.sin(a) * r;
      add(world, new THREE.CircleGeometry(0.5, 20).rotateX(-Math.PI / 2), M.dark, x, 0.05, z);
      add(world, new THREE.TorusGeometry(0.55, 0.1, 6, 20), M.white, x, 0.06, z).rotation.x = Math.PI / 2;
    }
    for (let i = 0; i < 7; i++) add(world, new THREE.BoxGeometry(2.2, 0.15, 0.7), M.trunk, 0, 0.2, 18 + i * 0.8);
  }
  scene.add(world);
}
buildMap(MAPS[0].id);

// ---------- 캐릭터 ----------
function textSprite(text, px = 40, fill = '#fff') {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64;
  const c = cv.getContext('2d'); c.font = `bold ${px}px system-ui`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.lineWidth = 6; c.strokeStyle = '#0008'; c.strokeText(text, 128, 32); c.fillStyle = fill; c.fillText(text, 128, 32);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthWrite: false }));
  s.scale.set(2, 0.5, 1); return s;
}
const sphere = (r, ...a) => new THREE.SphereGeometry(r, 16, 12, ...a);
// 얼음 껍질: 펭귄 실루엣(몸·머리·목도리)을 바깥에서 따라 감싸는 각진 얼음. 모든 펭귄이 같은 모양을 같이 씀
// 중심에서 사방으로 광선을 쏘아 펭귄을 이루는 구들의 바깥 면까지 거리 + 여유 → 꼭짓점을 조금씩 흔들어 크리스털 면처럼
const ICE_SHAPE = [[0, 0.64, 0, 0.56], [0, 1.34, 0, 0.53], [0, 1.0, 0, 0.5]]; // 몸·머리·목도리 [x,y,z,반지름] (chars.js 펭귄 크기)
const iceShellGeo = (() => {
  const geo = new THREE.IcosahedronGeometry(1, 1), pos = geo.attributes.position, c = new THREE.Vector3(0, 0.95, 0); // 면을 크게 나눠 각지게
  let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const d = new THREE.Vector3(), oc = new THREE.Vector3(), jitter = new Map(); // 같은 꼭짓점은 같은 흔들림(면이 벌어지지 않게)
  for (let i = 0; i < pos.count; i++) {
    d.fromBufferAttribute(pos, i).normalize();
    let t = 0;
    for (const [x, y, z, r] of ICE_SHAPE) { // 광선이 구를 빠져나가는 거리 중 가장 먼 것
      oc.set(c.x - x, c.y - y, c.z - z);
      const bb = oc.dot(d), disc = bb * bb - (oc.lengthSq() - r * r);
      if (disc > 0) t = Math.max(t, -bb + Math.sqrt(disc));
    }
    const key = d.toArray().map((v) => v.toFixed(3)).join();
    if (!jitter.has(key)) jitter.set(key, 0.12 + rnd() * 0.2);
    const p = c.clone().addScaledVector(d, t + jitter.get(key));
    pos.setXYZ(i, p.x, Math.max(0.02, p.y), p.z); // 바닥은 평평하게
  }
  geo.computeVertexNormals();
  return geo;
})();
const iceM = new THREE.MeshPhongMaterial({ color: '#a9dcff', transparent: true, opacity: 0.45, shininess: 150, specular: '#ffffff', flatShading: true, depthWrite: false });
const iceLineM = new THREE.MeshBasicMaterial({ color: '#4a8fd6', side: THREE.BackSide });
const iceGlintM = new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.7, depthWrite: false });
const iceBaseM = lam('#7cc0f0');
function makeIce() {
  const ice = new THREE.Group();
  const shell = new THREE.Mesh(iceShellGeo, iceM); shell.renderOrder = 5;
  const line = new THREE.Mesh(iceShellGeo, iceLineM); line.scale.setScalar(1.035); line.position.y = -0.03; // 굵은 파란 외곽선
  ice.add(line, shell);
  for (const [x, y, rz, h] of [[-0.2, 1.15, -0.5, 0.9], [0.05, 1.05, -0.5, 0.55]]) { // 앞면 반사 줄
    const g = new THREE.Mesh(new THREE.BoxGeometry(0.05, h, 0.01), iceGlintM);
    g.position.set(x, y, 0.72); g.rotation.z = rz; g.renderOrder = 6; ice.add(g);
  }
  const base = add(ice, new THREE.DodecahedronGeometry(0.85), iceBaseM, 0, 0.05, 0); base.scale.set(1, 0.14, 0.9); // 바닥 진한 얼음
  ice.visible = false;
  return ice;
}
// 캐릭터: 모두 같은 펭귄, 목도리 색 = 팀 색 (chars.js). 3번 맞아 얼면 얼음 덩어리에 갇힌다
function makeChar(name, team) {
  const g = new THREE.Group(), ice = makeIce();
  const body = buildPenguin(THREE, TEAM_COLORS[team] ?? '#888');
  const ball = add(g, sphere(1), M.white); ball.visible = false;
  const tag = textSprite(name, 40, ['#ffc9a8', '#b9d4ff'][team] ?? '#fff'); tag.position.y = 2.55;
  const emo = textSprite('', 48); emo.position.y = 3.15; emo.visible = false;
  g.add(body, ice, tag, emo); scene.add(g);
  return { g, body, ice, ball, tag, emo };
}

// ---------- 상태 ----------
const ents = new Map(); // id -> { c, x,y,z,yaw, tx,ty,tz,tyaw, frozen, roll, hp, ammo, score, name, emoUntil }
const balls = new Map(); // id -> { mesh, x,y,z, vx,vy,vz, age }
const piles = new Map(); // id -> Group
const parts = [];
const me = { x: 0, y: 0, z: 30, yaw: Math.PI, vy: 0, kx: 0, kz: 0, ivx: 0, ivz: 0 };
let myId = 0, roundBreak = false, bannerUntil = 0, spawned = false, camYaw = Math.PI, viewYaw = Math.PI, turnV = 0, pitch = 0.22, jump = false, shake = 0, lastSend = 0, lastSent = '', flashUntil = 0, flashText = '';
const keys = new Set();

function addEnt(id, name, team, bot) {
  if (ents.has(id)) return;
  const c = makeChar(name, team);
  if (id === myId) c.tag.visible = false;
  ents.set(id, { c, name, team, bot, spd: 0, snapT: 0, x: null, y: 0, z: 0, yaw: 0, tx: 0, ty: 0, tz: 0, tyaw: 0, frozen: 0, roll: 0, hp: 3, ammo: 5, score: 0, emoUntil: 0 });
}
function removeEnt(id) { const e = ents.get(id); if (e) { scene.remove(e.c.g); ents.delete(id); } }
function removeBall(id) { const b = balls.get(id); if (b) { scene.remove(b.mesh); balls.delete(id); } }
function setPile(p) {
  piles.get(p.id) && scene.remove(piles.get(p.id));
  const g = new THREE.Group(); let y = 0;
  p.parts.forEach((r, i) => { y += i ? r * 0.85 : r; add(g, sphere(r), M.white, 0, y, 0); y += r * 0.85; });
  if (p.parts.length === 3) { // 꼭대기에 얼굴
    const r = p.parts[2], top = y - r * 0.85;
    add(g, new THREE.ConeGeometry(r * 0.15, r * 0.7, 8), M.carrot, 0, top, r).rotation.x = Math.PI / 2;
    add(g, sphere(r * 0.1), M.dark, -r * 0.35, top + r * 0.3, r * 0.85);
    add(g, sphere(r * 0.1), M.dark, r * 0.35, top + r * 0.3, r * 0.85);
  }
  g.position.set(p.x, H(p.x, p.z) - 0.1, p.z); scene.add(g); piles.set(p.id, g);
}
const partGeo = sphere(0.08), ballGeo = sphere(0.18);
function puff(x, y, z, n) {
  for (let i = 0; i < n; i++) {
    const m = add(scene, partGeo, M.white, x, y, z);
    parts.push({ m, vx: (Math.random() - 0.5) * 6, vy: Math.random() * 5, vz: (Math.random() - 0.5) * 6, life: 0.6 });

}
let ac;
function sfx(freq, dur, vol = 0.15) {
  ac ??= new AudioContext();
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = 'triangle'; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 0.5, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);

const flash = (text, ms = 1500) => { flashText = text; flashUntil = performance.now() + ms; };

// ---------- 네트워크 ----------
let ws, hello, backoff = 1000;
const send = (m) => ws?.readyState === 1 && ws.send(JSON.stringify(m));
function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  ws.onopen = () => { backoff = 1000; send({ t: 'hello', ...hello }); };
  ws.onmessage = (e) => onMsg(JSON.parse(e.data));
  ws.onclose = () => { flash('연결이 끊겼어요. 다시 접속하는 중…', backoff + 500); setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 10000); };
}
function onMsg(m) {
  if (m.t === 'full') return flash('방이 모두 꽉 찼어요. 잠시 뒤 다시 들어가 볼게요', 4000);
  if (m.t === 'welcome') {
    for (const id of [...ents.keys()]) removeEnt(id);
    for (const id of [...balls.keys()]) removeBall(id);
    for (const g of piles.values()) scene.remove(g);
    piles.clear();
    if (m.map !== map.id) buildMap(m.map);
    myId = m.id; spawned = false; charge = null; mySeqs.clear();
    for (const [id, name, team, bot] of m.players) addEnt(id, name, team, bot); // server.ts meta 순서: id, 이름, 팀, 봇
    for (const p of m.piles) setPile(p);
    return;
  }
  for (const ev of m.ev) onEv(ev);
  for (const [id, x, y, z, yaw, frozen, roll, hp, ammo, score, freezes] of m.p) {
    const e = ents.get(id); if (!e) continue;
    // 속도(조준 보정은 거의 멈춘 상대에게만 걸기 위해)
    const nowT = performance.now(), sdt = Math.max(0.03, (nowT - e.snapT) / 1000);
    if (e.snapT) e.spd += (Math.hypot(x - e.tx, z - e.tz) / sdt - e.spd) * 0.5;
    e.snapT = nowT;
    Object.assign(e, { tx: x, ty: y, tz: z, tyaw: yaw, frozen, roll, hp, score, freezes });
    if (id !== myId || nowT - lastThrowAt > 500) e.ammo = ammo; // 내가 방금 던진 건 서버 반영 전까지 내 계산 유지
    if (e.x === null || Math.hypot(e.x - x, e.z - z) > 8) Object.assign(e, { x, y, z, yaw });
    if (id === myId && !spawned) { Object.assign(me, { x, y, z, yaw }); camYaw = viewYaw = yaw; spawned = true; }
  }
  roundBreak = !!m.br;
  drawTeams(m.ts, m.tl);
  drawBoard();
}
function onEv(ev) {
  switch (ev[0]) {
    case 'join': addEnt(ev[1], ev[2], ev[3], ev[4]); break;
    case 'leave': removeEnt(ev[1]); break;
    case 'th': {
      const [, id, owner, x, y, z, vx, vy, vz, s] = ev;
      if (owner === myId && mySeqs.delete(s)) { // 내가 예측해서 이미 띄운 눈덩이: 서버 번호로 이어 붙임
        const b = balls.get(-s);
        if (b) { balls.delete(-s); balls.set(id, b); }
        break;
      }
      balls.set(id, { mesh: add(scene, ballGeo, M.white), x, y, z, vx, vy, vz, age: 0 });
      break;
    }
    case 'hit': {
      const [, id, x, y, z, target, kx, kz] = ev;
      removeBall(id); puff(x, y, z, 14);
      if (target === myId) { me.kx += kx; me.kz += kz; me.vy = Math.max(me.vy, 4); shake = 0.35; sfx(160, 0.2, 0.25); }
      else sfx(260, 0.12, 0.08);
      break;
    }
    case 'splat': if (balls.has(ev[1])) puff(ev[2], ev[3], ev[4], 6); removeBall(ev[1]); break; // 내 화면에서 먼저 떨어졌으면 puff 생략
    case 'over': {
      const [, w, a, b] = ev, my = ents.get(myId)?.team;
      const mine = ents.get(myId);
      banner((w < 0 ? `무승부! ${a} : ${b}` : `${TEAM_NAMES[w]} 승리! ${a} : ${b}${w === my ? ' 🎉' : ''}`)
        + `\n이번 판 내 기록: 🎯 맞힘 ${mine?.score ?? 0} · 🥶 얼음 ${mine?.freezes ?? 0}`, 5500);
      sfx(w === my ? 660 : 220, 0.5, 0.2);
      break;
    }
    case 'round': spawned = false; charge = null; banner('새 판 시작! ⛄', 2000); break;
    case 'pile': setPile(ev[1]); sfx(330, 0.1, 0.06); break;
    case 'pilex': scene.remove(piles.get(ev[1])); piles.delete(ev[1]); break;
    case 'emo': {
      const e = ents.get(ev[1]); if (!e) break;
      const s = textSprite(EMOTES[ev[2]], 48); s.position.y = 3.15;
      e.c.g.remove(e.c.emo); e.c.emo = s; e.c.g.add(s); e.emoUntil = performance.now() + 2000;
      break;
    }
  }
}

// 키보드와 터치 버튼이 함께 쓰는 동작
function press(k) {
  if (keys.has(k)) return;
  keys.add(k);
  if (k === 'f') send({ t: 'g', on: true });
  if (k === 'r') send({ t: 'r', on: true });
  if (k === ' ') jump = true;
  if (k === 'e' || k === 'j') startCharge(); // E(WASD 손)·J(방향키 손), 폰은 ❄️ 버튼이 'j'
}
function release(k) {
  keys.delete(k);
  if (k === 'f') send({ t: 'g', on: false });
  if (k === 'r') send({ t: 'r', on: false });
  if (k === 'e' || k === 'j') releaseCharge();
}

const cv = renderer.domElement, drags = new Map();

});

const joy = { x: 0, y: 0, id: null }, joyEl = $('joy');
function moveJoy(e) {
  const r = joyEl.getBoundingClientRect(), R = r.width / 2;
  let x = (e.clientX - r.left - R) / R, y = (e.clientY - r.top - R) / R;
  const m = Math.hypot(x, y);
  if (m > 1) { x /= m; y /= m; }
  if (m < 0.15) x = y = 0; // 데드존
  Object.assign(joy, { x, y });
  $('knob').style.transform = `translate(${x * R * 0.6}px, ${y * R * 0.6}px)`;
}
joyEl.addEventListener('pointerdown', (e) => { joy.id = e.pointerId; joyEl.setPointerCapture(e.pointerId); moveJoy(e); });

for (const t of ['pointerup', 'pointercancel']) joyEl.addEventListener(t, (e) => {
  if (e.pointerId !== joy.id) return;
  Object.assign(joy, { x: 0, y: 0, id: null });
  $('knob').style.transform = '';
});

  : e.code === 'Space' ? ' ' : e.code.startsWith('Shift') ? 'shift' : e.key.toLowerCase();

// ---------- 던지기: 꾹 눌러 모은 만큼 멀리(4~30m), 떼면 던짐 ----------
const CHARGE_MS = 1000, MIN_D = 4, MAX_D = 30;
let charge = null, seq = 0, lastThrowAt = 0;
const mySeqs = new Set(); // 서버 확인을 기다리는 내 눈덩이 번호
const chargeAmt = () => charge ? Math.min(1, (performance.now() - charge.t0) / CHARGE_MS) : 0;
function startCharge() {
  const e = ents.get(myId);
  if (charge || !e || e.frozen || roundBreak) return;
  if (e.roll) return flash(isTouch ? '굴리는 중엔 못 던져요 (⚪ 굴리기에서 손 떼기)' : '굴리는 중엔 못 던져요 (R 떼기)');
  if (e.ammo < 1) return flash(isTouch ? '눈이 없어요! 🤲 모으기를 꾹 눌러요' : '눈이 없어요! F 를 꾹 눌러 모아요');
  charge = { t0: performance.now() };
}
// 착지점: 보는 방향으로 모은 거리만큼. 근처(2.5m)에 거의 멈춘 상대가 있으면 그쪽으로 당김(조준 보정)
// 뛰는 상대에겐 안 걸어서, 앞을 노리고 던진 게 되돌려지지 않음
function landing() {
  const d = MIN_D + chargeAmt() * (MAX_D - MIN_D), x = me.x + Math.sin(camYaw) * d, z = me.z + Math.cos(camYaw) * d;
  const my = ents.get(myId)?.team;
  let best = null, bd = 2.5;
  for (const [id, e] of ents) {
    if (id === myId || e.x === null || e.frozen || e.team === my || e.spd > 0.8) continue;
    const dd = Math.hypot(e.x - x, e.z - z);
    if (dd < bd) { bd = dd; best = e; }
  }
  return best ? { x: best.x, y: best.y + 1, z: best.z, lock: true } : { x, y: H(x, z), z, lock: false };
}
// 목표 지점에 떨어지는 속도 (server.ts 의 launch 와 같은 식)
function launch(tx, ty, tz) {
  const ox = me.x + Math.sin(me.yaw) * 0.6, oy = me.y + 1.5, oz = me.z + Math.cos(me.yaw) * 0.6;
  const dx = tx - ox, dz = tz - oz, t = Math.max(0.15, Math.hypot(dx, dz) / 22);
  return { ox, oy, oz, t, vx: dx / t, vy: (ty - oy - 0.5 * G * t * t) / t - 0.5 * G / 30, vz: dz / t };
}
function releaseCharge() {
  if (!charge) return;
  const p = landing(), e = ents.get(myId);
  charge = null;
  if (!e || e.frozen || e.ammo < 1 || roundBreak || performance.now() - lastThrowAt < 300) return;
  me.yaw = Math.atan2(p.x - me.x, p.z - me.z);
  const v = launch(p.x, p.y, p.z);
  sendPos();
  seq = seq % 65535 + 1;
  mySeqs.add(seq);
  send({ t: 'th', vx: v.vx, vy: v.vy, vz: v.vz, s: seq });
  // 서버 확인을 기다리지 않고 내 화면에 바로 띄움(예측). 서버가 같은 번호로 확인하면 그 눈덩이로 이어짐
  balls.set(-seq, { mesh: add(scene, ballGeo, M.white), x: v.ox, y: v.oy, z: v.oz, vx: v.vx, vy: v.vy, vz: v.vz, age: 0 });
  e.ammo--;
  lastThrowAt = performance.now();
  sfx(520, 0.08, 0.1);
}
// 모으는 동안 보이는 착지 원과 포물선(점). 흰 눈 위에서 보이게 진한 하늘색, 조준 보정이 걸리면 빨강
const AIM = '#1e90ff', LOCK = '#ff3b3b', DOTS = 14;
const aimM = new THREE.MeshBasicMaterial({ color: AIM, transparent: true, opacity: 0.9, depthTest: false });
const ring = new THREE.Mesh(new THREE.RingGeometry(0.5, 0.8, 32).rotateX(-Math.PI / 2), aimM);
const dots = Array.from({ length: DOTS }, () => new THREE.Mesh(sphere(0.07), aimM));
for (const m of [ring, ...dots]) { m.renderOrder = 10; m.visible = false; scene.add(m); }
function drawAim(t) {
  ring.visible = !!charge;
  for (const d of dots) d.visible = !!charge;
  if (!charge) return;
  const p = landing();
  me.yaw = Math.atan2(p.x - me.x, p.z - me.z); // 모으는 동안 던질 쪽을 바라봄
  const v = launch(p.x, p.y, p.z);
  dots.forEach((d, i) => {
    const tt = v.t * (i + 1) / (DOTS + 1);
    d.position.set(v.ox + v.vx * tt, v.oy + v.vy * tt + 0.5 * G * tt * tt, v.oz + v.vz * tt);
  });
  ring.position.set(p.x, H(p.x, p.z) + 0.06, p.z);
  aimM.color.set(p.lock ? LOCK : AIM); // 빨강 = 조준 보정으로 상대에게 고정됨
  const far = 1 + Math.hypot(p.x - me.x, p.z - me.z) * 0.04; // 멀수록 크게 그려서 폰에서도 잘 보이게
  ring.scale.setScalar(far * (p.lock ? 1.4 : chargeAmt() >= 1 ? 1 + 0.12 * Math.sin(t * 14) : 1));
}

// 내 위치 보고 (바뀐 게 있을 때만)
function sendPos() {
  const msg = [me.x, me.y, me.z, me.yaw].map((v) => v.toFixed(2)).join();
  if (msg === lastSent) return;
  lastSend = performance.now(); lastSent = msg;
  send({ t: 'p', x: +me.x.toFixed(2), y: +me.y.toFixed(2), z: +me.z.toFixed(2), yaw: +me.yaw.toFixed(2) });
}

// ---------- 루프 ----------
const clock = new THREE.Clock();
const wrap = (a) => ((a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), now = performance.now(), t = now / 1000;
  const mine = ents.get(myId);

  // 내 이동 (클라이언트에서 계산, 서버에 위치 보고)
  if (mine && spawned) {
    const kd = (...ks) => ks.some((k) => keys.has(k)) ? 1 : 0;
    // WASD 와 방향키는 똑같이: 앞뒤 이동 + 좌우 돌기 (폰 조이스틱의 좌우는 옆걸음)
    const f = kd('w', 'arrowup') - kd('s', 'arrowdown') - joy.y, s = joy.x;
    // ← → 는 시점 돌리기: 바로 최고 속도가 아니라 0.2초쯤에 걸쳐 부드럽게 빨라짐(어지럽지 않게)
    turnV += ((kd('a', 'arrowleft') - kd('d', 'arrowright')) * 1.5 - turnV) * Math.min(1, dt * 8);
    camYaw += turnV * dt;
    const len = Math.max(1, Math.hypot(f, s)); // 조이스틱을 살짝 밀면 천천히
    const run = keys.has('shift') || Math.hypot(joy.x, joy.y) > 0.95; // 조이스틱 끝까지 밀면 달리기
    const sp = mine.frozen || keys.has('f') ? 0 : (run ? 9 : 5.5) * (mine.roll ? 0.6 : 1) * (charge ? 0.5 : 1); // 모으는 중엔 절반 속도
    // 이동은 카메라 기준, 캐릭터는 가는 방향으로 부드럽게 돌아봄 (뒤로 가면 얼굴이 보임)
    const fx = Math.sin(camYaw), fz = Math.cos(camYaw);
    const vx = (fx * f - fz * s) / len * sp, vz = (fz * f + fx * s) / len * sp;
    if (Math.hypot(vx, vz) > 0.1) me.yaw += wrap(Math.atan2(vx, vz) - me.yaw) * Math.min(1, dt * 12);
    // 빙판 위에선 속도가 천천히 따라와 미끄러진다
    const ice = map.ice && Math.hypot(me.x, me.z) < map.ice ? Math.min(1, dt * 1.8) : 1;
    me.ivx += (vx - me.ivx) * ice; me.ivz += (vz - me.ivz) * ice;
    me.x = Math.max(-ARENA, Math.min(ARENA, me.x + (me.ivx + me.kx) * dt));
    me.z = Math.max(-ARENA, Math.min(ARENA, me.z + (me.ivz + me.kz) * dt));
    [me.x, me.z] = pushOut(map, me.x, me.z); // 나무·바위·오두막을 뚫고 지나가지 않게
    me.kx *= Math.exp(-5 * dt); me.kz *= Math.exp(-5 * dt);
    const gy = H(me.x, me.z), grounded = me.y <= gy + 0.05;
    me.vy += -20 * dt; me.y += me.vy * dt;
    if (me.y <= gy) { me.y = gy; me.vy = 0; }
    if (jump && grounded && !mine.frozen) me.vy = 7;
    jump = false;
    if (mine.frozen) charge = null;
    drawAim(t);
    Object.assign(mine, { x: me.x, y: me.y, z: me.z, yaw: me.yaw, moving: (f || s) && sp > 0 });
    if (now - lastSend > 66) sendPos();
  }

  // ponytail: 남의 위치는 최신 스냅샷으로 지수 보간. 끊김이 보이면 스냅샷 버퍼 + 시간지연 보간으로 교체
  const k = 1 - Math.exp(-dt * 12);
  for (const [id, e] of ents) {
    if (e.x === null) continue;
    if (id !== myId) {
      e.moving = Math.hypot(e.tx - e.x, e.tz - e.z) > 0.05;
      e.x += (e.tx - e.x) * k; e.y += (e.ty - e.y) * k; e.z += (e.tz - e.z) * k; e.yaw += wrap(e.tyaw - e.yaw) * k;
    }
    const c = e.c;
    c.g.position.set(e.x, e.y, e.z); c.g.rotation.y = e.yaw;
    c.ice.visible = !!e.frozen;
    c.g.rotation.z = e.frozen ? Math.sin(t * 45) * 0.02 : 0; // 얼어 있는 동안 덜덜 떨기
    c.body.position.y = e.moving && !e.frozen ? Math.abs(Math.sin(t * 10)) * 0.1 : 0;
    c.body.scale.y = id === myId && keys.has('f') && !e.frozen ? 0.75 : 1;
    c.ball.visible = e.roll > 0;
    if (e.roll) { c.ball.scale.setScalar(e.roll); c.ball.position.set(0, e.roll, 0.7 + e.roll); if (e.moving) c.ball.rotation.x += dt * 4 / e.roll; }
    c.emo.visible = now < e.emoUntil;
  }

  for (const [id, b] of balls) {
    b.vy += G * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt; b.age += dt;
    b.mesh.position.set(b.x, b.y, b.z);
    if (b.y < H(b.x, b.z) || blocksBall(map, b.x, b.y, b.z)) { puff(b.x, b.y, b.z, 6); removeBall(id); } // 서버 확인 전에 내 화면에서 먼저 착지·충돌
    else if (b.age > 4) removeBall(id); // 서버도 4초 후 조용히 지움
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.vy += G * dt; p.m.position.x += p.vx * dt; p.m.position.y += p.vy * dt; p.m.position.z += p.vz * dt;
    p.life -= dt; p.m.scale.setScalar(Math.max(0.01, p.life / 0.6));
    if (p.life <= 0) { scene.remove(p.m); parts.splice(i, 1); }
  }
  chairs.forEach((c, i) => {
    const u = (t * 0.02 + i / chairs.length) % 1, up = u < 0.5, v = up ? u * 2 : 2 - u * 2;
    const z = LIFT_Z0 + (LIFT_Z1 - LIFT_Z0) * v;
    c.position.set(LIFT_X + (up ? -1.3 : 1.3), liftY(z), z);
  });

  // 카메라: 3인칭, 머리 뒤 위. 조준(camYaw)은 바로 바뀌고 화면(viewYaw)은 살짝 늦게 부드럽게 따라감
  viewYaw += wrap(camYaw - viewYaw) * Math.min(1, dt * 10);
  const head = new THREE.Vector3(me.x, me.y + 1.6, me.z);
  shake = Math.max(0, shake - dt);
  camera.position.set(
    head.x - Math.sin(viewYaw) * Math.cos(pitch) * 6 + (Math.random() - 0.5) * shake,
    head.y + Math.sin(pitch) * 6 + (Math.random() - 0.5) * shake,
    head.z - Math.cos(viewYaw) * Math.cos(pitch) * 6,
  );
  camera.position.y = Math.max(camera.position.y, H(camera.position.x, camera.position.z) + 0.5);
  camera.lookAt(head.x, head.y + 1.0, head.z); // 조준점이 바로 앞 바닥이 아니라 멀리 보이게

  // HUD
  if (mine) $('hud').textContent = `❤️ ${'●'.repeat(mine.hp)}   ❄️ ${mine.ammo}/${MAX_AMMO}\n🎯 맞힘 ${mine.score} · 🥶 얼음 ${mine.freezes ?? 0}`;
  $('banner').style.display = now < bannerUntil ? '' : 'none';
  $('msg').textContent = mine?.frozen ? '🧊 꽁꽁 얼었어요! 3초 뒤 풀려요'
    : now < flashUntil ? flashText : '';
  renderer.render(scene, camera);
});
</script>
</html>
